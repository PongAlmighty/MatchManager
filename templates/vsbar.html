<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Single Match</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Yantramanav:wght@100;300;400;500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body class="chroma-body">
    <div id="paused-dot" class="paused-dot{{ " on" if queries_paused }}" title="Challonge queries paused"></div>
    <!--<div class="vsRoundedRec"> -->
    <div class="match-container">
        <div class="fixed-width">
            <span class="player1-name">{{ match.player1|safe }}</span>
            <span class="vs">{{ match.versus|safe }}</span>
            <span class="player2-name">{{ match.player2|safe }}</span>
        </div>
    </div>
    <!--</div>
    <!--<div class="small-timeBox">
        <!-- Other content can go here if needed 
    </div> -->
<script>
    // Stay current on its own: re-read this page every 20 seconds and swap in the new names.
    // The server shares Challonge data between pages, so this only costs calls for this ring's tournaments.
    setInterval(function () {
        fetch(location.href, { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
            .then(function (html) {
                var next = new DOMParser().parseFromString(html, 'text/html');
                var cur = document.querySelector('.match-container'), fresh = next.querySelector('.match-container');
                if (cur && fresh && cur.innerHTML !== fresh.innerHTML) cur.innerHTML = fresh.innerHTML;
                var dot = next.getElementById('paused-dot');
                if (dot) document.getElementById('paused-dot').className = dot.className;
            })
            .catch(function () { /* keep showing the last names */ });
    }, 20000);
</script>
</body>
</html>
